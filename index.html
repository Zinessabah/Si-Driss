    <script>
      // Suppress Vite HMR WebSocket errors in AI Studio iframe environment (HMR is disabled by platform)
      (function() {
        function isViteHmrError(err) {
          if (!err) return false;
          var msg = String(err.message || '');
          var stack = String(err.stack || '');
          var file = String(err.filename || '');
          return (
            msg.indexOf('WebSocket') !== -1 ||
            stack.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            stack.indexOf('@vite/client') !== -1 ||
            file.indexOf('@vite/client') !== -1
          );
        }
        window.addEventListener('error', function(event) {
          if (isViteHmrError(event) || isViteHmrError(event.error)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (isViteHmrError(event.reason)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
