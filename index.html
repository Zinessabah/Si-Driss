    <script>
      // Suppress Vite HMR WebSocket errors in AI Studio iframe environment (HMR is disabled by platform)
      (function() {
        function isViteHmrText(text) {
          if (!text) return false;
          var str = String(text);
          return (
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf('vite/client') !== -1 ||
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            str.indexOf('ws://') !== -1 ||
            str.indexOf('wss://') !== -1
          );
        }

        // Filter console logs for [vite]
        var origConsoleError = console.error;
        console.error = function() {
          var firstArg = arguments.length > 0 ? String(arguments[0] || '') : '';
          if (isViteHmrText(firstArg)) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var firstArg = arguments.length > 0 ? String(arguments[0] || '') : '';
          if (isViteHmrText(firstArg)) {
            return;
          }
          return origConsoleWarn.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          var combined = String(event?.message || '') + ' ' + String(event?.filename || '') + ' ' + String(event?.error?.message || '') + ' ' + String(event?.error?.stack || '');
          if (isViteHmrText(combined)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event?.reason;
          var combined = String(reason?.message || '') + ' ' + String(reason?.stack || '') + ' ' + String(reason || '');
          if (isViteHmrText(combined)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
